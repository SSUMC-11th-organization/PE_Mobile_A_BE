<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MovieLog API 연결 확인</title>
  <style>
    :root { --violet: #6750a4; --bg: #faf9f5; --line: #cbc4d2; --ok: #1b7f3b; --err: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; background: var(--bg); color: #1c1b1f; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { color: var(--violet); font-size: 24px; margin: 0 0 4px; }
    .sub { color: #79747e; margin: 0 0 20px; font-size: 14px; }
    section { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    h2 { font-size: 16px; margin: 0 0 4px; }
    code { background: #f2eff7; padding: 1px 6px; border-radius: 4px; font-size: 13px; }
    .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--violet); color: #fff; font-size: 15px; cursor: pointer; }
    .result { margin-top: 12px; font-size: 14px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; }
    .badge.ok { background: #e3f4e8; color: var(--ok); }
    .badge.err { background: #fde7e5; color: var(--err); }
    pre { background: #1c1b1f; color: #f4f1fa; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; margin: 8px 0 0; white-space: pre-wrap; word-break: break-all; }
    ul.ratings { list-style: none; padding: 0; margin: 8px 0 0; }
    ul.ratings li { border-top: 1px solid #eee; padding: 8px 0; }
    .stars { color: #f5a623; letter-spacing: 1px; }
    .meta { color: #79747e; font-size: 12px; }
  </style>
</head>
<body>
<main>
  <h1>MovieLog API 연결 확인</h1>
  <p class="sub">이 화면(<span id="origin"></span>)에서 백엔드 <code id="base"></code>를 브라우저 fetch로 호출합니다.</p>

  <section>
    <h2>닉네임 중복 체크</h2>
    <code>GET /members/nickname/{nickname}</code>
    <form class="row" data-api="nickname">
      <input name="value" value="수현" aria-label="닉네임" />
      <button type="submit">확인</button>
    </form>
    <div class="result" id="nickname-result"></div>
  </section>

  <section>
    <h2>이메일 중복 체크</h2>
    <code>GET /members/email/{email}</code>
    <form class="row" data-api="email">
      <input name="value" value="noco@umc.com" aria-label="이메일" />
      <button type="submit">확인</button>
    </form>
    <div class="result" id="email-result"></div>
  </section>

  <section>
    <h2>유저별 평점 조회</h2>
    <code>GET /members/{memberId}/ratings</code>
    <form class="row" data-api="ratings">
      <input name="value" value="1" inputmode="numeric" aria-label="회원 ID" />
      <button type="submit">조회</button>
    </form>
    <div class="result" id="ratings-result"></div>
  </section>
</main>

<script>
  const BASE_URL = 'http://localhost:8080';
  document.getElementById('origin').textContent = location.origin;
  document.getElementById('base').textContent = BASE_URL;

  const paths = {
    nickname: (v) => `/members/nickname/${encodeURIComponent(v)}`,
    email: (v) => `/members/email/${encodeURIComponent(v)}`,
    ratings: (v) => `/members/${encodeURIComponent(v)}/ratings`,
  };

  function escapeHtml(text) {
    return String(text ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderBody(api, data) {
    if (api === 'ratings' && Array.isArray(data)) {
      if (data.length === 0) return '<p>남긴 평점이 없어요.</p>';
      return '<ul class="ratings">' + data.map((r) =>
        `<li><span class="stars">${'★'.repeat(r.score)}${'☆'.repeat(5 - r.score)}</span>
         TMDB 영화 <b>#${r.movieId}</b> — ${escapeHtml(r.comment)}
         <div class="meta">ratingId ${r.ratingId} · ${escapeHtml(r.createdAt)}</div></li>`).join('') + '</ul>';
    }
    if (typeof data?.available === 'boolean') {
      return data.available
        ? '<span class="badge ok">사용할 수 있어요</span>'
        : '<span class="badge err">이미 사용 중이에요</span>';
    }
    return '';
  }

  document.querySelectorAll('form[data-api]').forEach((form) => {
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const api = form.dataset.api;
      const value = form.elements.value.value.trim();
      const url = BASE_URL + paths[api](value);
      const box = document.getElementById(`${api}-result`);
      box.innerHTML = '불러오는 중...';
      try {
        const response = await fetch(url);
        const data = await response.json();
        const statusBadge = response.ok
          ? `<span class="badge ok">${response.status}</span>`
          : `<span class="badge err">${response.status}</span>`;
        box.innerHTML = `${statusBadge} ${renderBody(api, data)}<pre>GET ${escapeHtml(url)}\n\n${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
      } catch (error) {
        // CORS로 막히면 fetch가 TypeError로 끝납니다. 자세한 원인은 개발자 도구 Console에 표시됩니다.
        box.innerHTML = `<span class="badge err">요청 실패</span> 서버가 꺼져 있거나 CORS로 막혔어요. F12 → Console을 확인하세요.<pre>${escapeHtml(error)}</pre>`;
        console.error(error);
      }
    });
  });
</script>
</body>
</html>
