spring:
  config:
    import: optional:file:.env[.properties]   # lc/.env 의 DB_PASSWORD 등을 읽어옴
  application:
    name: umc11th
  datasource:
    url: jdbc:mysql://localhost:3307/umc-mysql?serverTimezone=Asia/Seoul
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false