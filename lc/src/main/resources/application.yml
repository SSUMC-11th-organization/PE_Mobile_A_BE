spring:
  config:
    import: optional:file:.env[.properties]   # lc/.env 의 DB_PASSWORD 등을 읽어옴
  application:
    name: umc11th
  datasource:
    url: jdbc:mysql://localhost:3307/umc_movie?serverTimezone=Asia/Seoul
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}                          # 서명용 비밀키 (32자 이상, .env로 관리)
  access-expiration: ${JWT_ACCESS_EXPIRATION}    # Access Token 유효시간(초)
