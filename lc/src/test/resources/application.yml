# 테스트가 돌 때만 메모리 위에 만들어졌다 사라지는 DB를 쓴다. 개발용 MySQL의 데이터를 건드리지 않는다.
spring:
  application:
    name: umc11th
  datasource:
    # 컨텍스트마다 다른 DB 이름을 써서, 서로 다른 설정의 컨텍스트가 같은 메모리 DB를 덮어쓰지 않게 한다
    url: jdbc:h2:mem:umc_${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 테스트마다 스키마를 새로 만들어 엔티티 매핑도 함께 검증한다
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

jwt:
  secret: test-secret-for-tests-only-test-secret-for-tests-only-0123456789
  access-expiration: 3600
